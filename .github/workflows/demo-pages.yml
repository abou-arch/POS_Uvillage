# Démo de la caisse sur GitHub Pages : https://abou-arch.github.io/POS_Uvillage/
# Aucune vraie API : la fausse API (pos-caisse/mock-api) tourne dans la page (npm run build:demo, voir src/demo/).
# Publiée à chaque push sur Abou qui touche pos-caisse/, après les tests ; ou à la main (onglet Actions).
name: Démo GitHub Pages

on:
  push:
    branches: [Abou]
    paths: ['pos-caisse/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-caisse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pos-caisse/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pos-caisse/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
